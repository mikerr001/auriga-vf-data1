<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Auriga VF Analyzer{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <style>
    :root {
      --auriga-blue: #4A90D9;
      --auriga-dark: #1a2340;
      --auriga-accent: #7BC67E;
    }
    body { background: #f4f6fb; font-family: 'Segoe UI', system-ui, sans-serif; }
    .navbar-brand { font-weight: 700; letter-spacing: .5px; }
    .navbar { background: var(--auriga-dark) !important; }
    .navbar .nav-link, .navbar-brand { color: #e8edf5 !important; }
    .navbar .nav-link:hover { color: var(--auriga-blue) !important; }
    .card { border: none; border-radius: 12px; box-shadow: 0 2px 12px rgba(0,0,0,.07); }
    .card-header { border-radius: 12px 12px 0 0 !important; font-weight: 600; }
    .btn-primary { background: var(--auriga-blue); border-color: var(--auriga-blue); }
    .btn-primary:hover { background: #3578c0; border-color: #3578c0; }
    .stat-card .display-5 { color: var(--auriga-blue); font-weight: 700; }
    .badge-success-soft { background: #e6f4ea; color: #2e7d32; font-size: .8rem; padding: .35em .7em; border-radius: 50px; }
    .badge-warn-soft   { background: #fff3e0; color: #e65100; font-size: .8rem; padding: .35em .7em; border-radius: 50px; }
    footer { color: #8a93a6; font-size: .82rem; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
<nav class="navbar navbar-expand-lg mb-4">
  <div class="container">
    <a class="navbar-brand" href="/">
      <i class="bi bi-crosshair2 me-2" style="color:var(--auriga-blue)"></i>Auriga VF Analyzer
    </a>
    <div class="navbar-nav ms-auto">
      <a class="nav-link" href="/sessions"><i class="bi bi-table me-1"></i>Compare Sessions</a>
      <a class="nav-link" href="/"><i class="bi bi-upload me-1"></i>New Analysis</a>
    </div>
  </div>
</nav>

<main class="container pb-5">
  {% block content %}{% endblock %}
</main>

<footer class="text-center py-4 mt-4">
  Auriga Virtual Fiducial Analyzer &mdash; Research Tool &mdash; Auriga Navigation Project
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
{% block scripts %}{% endblock %}
</body>
</html>
